# Publishes to the VS Code Marketplace and Open VSX. Pushing a v* tag is a release:
# it needs Darren's approval every time (AGENTS.md).
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tag matches package version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - name: Lint and types
        run: npm run lint

      - name: Tests (claims P1-P5)
        run: npm test

      - name: Claim register
        run: npm run check:claims

      - name: Claim fixtures against live Crossref
        run: npm run test:live

      - name: Package
        run: |
          npm run vsix
          cp dist/cli.js "cite-ledger-cli-${GITHUB_REF_NAME}.js"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ./*.vsix
            ./cite-ledger-cli-*.js

      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -n "$VSCE_PAT" ]; then
            npx @vscode/vsce publish --packagePath ./*.vsix -p "$VSCE_PAT"
          else
            echo "VSCE_PAT secret not set; skipping VS Code Marketplace publish."
          fi

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -n "$OVSX_PAT" ]; then
            npx ovsx publish ./*.vsix -p "$OVSX_PAT"
          else
            echo "OVSX_PAT secret not set; skipping Open VSX publish."
          fi
