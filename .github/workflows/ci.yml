name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint and types
        run: npm run lint

      - name: Tests (claims P1-P5)
        run: npm test

      - name: Claim register
        run: npm run check:claims

      - name: Package
        run: npm run vsix
